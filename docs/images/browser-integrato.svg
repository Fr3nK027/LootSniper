<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Architettura di LootSniper 9</title><desc id="desc">L'app Windows usa WebView2 per leggere otto marketplace e salva i risultati solo in locale.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151d"/><stop offset="1" stop-color="#102837"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="500" rx="34" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="72" fill="#effffc" font-size="34" font-weight="700">Una sola app. Browser e scansione già inclusi.</text><text x="64" y="108" fill="#91aaa9" font-size="18">Nessuna estensione, nessuna pagina da configurare.</text>
<g filter="url(#shadow)"><rect x="64" y="155" width="260" height="235" rx="24" fill="#142f3d" stroke="#54e0c2"/><rect x="470" y="155" width="260" height="235" rx="24" fill="#142f3d" stroke="#7699ff"/><rect x="876" y="155" width="260" height="235" rx="24" fill="#142f3d" stroke="#f8b55d"/></g>
