<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootSniper OS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #10b981; --accent-hover: #059669; --text: #f8fafc; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 340px; background: var(--panel); padding: 25px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #334155; overflow-y: auto; }
        .logo { font-size: 26px; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 10px; margin-bottom: 10px;}
        
        .btn-sync { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-sync:hover { background: #2563eb; }

        .search-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
        .search-box label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .search-box input, .search-box select { background: var(--panel); border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; outline: none; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;}
        
        .link-list { display: flex; flex-direction: column; gap: 8px; }
        .link-item { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .link-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .del-btn { color: var(--danger); cursor: pointer; background: none; border: none; font-weight: bold; }

        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .sort-select { background: var(--panel); color: white; border: 1px solid #334155; padding: 10px 15px; border-radius: 8px; font-weight: bold; outline: none; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; transition: 0.2s;}
        .card:hover { border-color: var(--accent); transform: translateY(-3px);}
        .card-header { padding: 15px; border-bottom: 1px solid #334155; }
        .card-title { font-size: 14px; font-weight: bold; color: #e2e8f0; margin-top: 5px; }
        .platform-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .vinted { background: #007782; } .ebay { background: #e53238; } .subito { background: #ff4a3d; }
        
        .card-body { padding: 15px; flex: 1; }
        .prices { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 10px; }
        .req-price { font-size: 22px; font-weight: 900; color: var(--success); }
        .est-price { text-align: right; }
        .est-price strong { font-size: 16px; color: var(--warning); text-decoration: line-through; }
        .card-footer { padding: 15px; display: flex; gap: 10px; background: #0f172a; }
        .btn-link { flex: 1; text-align: center; background: #334155; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #334155; max-height: 40vh; }
            .main { max-height: 60vh; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🎯 LootSniper</div>
        
        <button class="btn-sync" onclick="loadData()">🔄 Sincronizza Dati</button>

        <div class="search-box">
            <h3 style="font-size: 14px; margin-bottom: 5px;">Aggiungi Ricerca</h3>
            <label>Nome (es. RTX 4060)</label>
            <input type="text" id="l-nome">
            <label>Piattaforma</label>
            <select id="l-plat"><option value="VINTED">Vinted</option><option value="EBAY">eBay</option><option value="SUBITO">Subito</option></select>
            <label>URL Ricerca</label>
            <input type="text" id="l-url">
            <button class="btn-add" onclick="addLink()">➕ Salva sul Server</button>
        </div>

        <div>
            <h3 style="font-size: 14px; margin-bottom: 10px;">Link Attivi (<span id="links-count">0</span>)</h3>
            <div class="link-list" id="links-container"></div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <h1 style="font-size: 24px;">Mercato (<span id="bombs-count">0</span>)</h1>
            <select class="sort-select" id="sort-order" onchange="renderDeals()">
                <option value="date">🕒 Ultimi Trovati</option>
                <option value="margin">🔥 Sconto Maggiore</option>
                <option value="price-asc">💶 Prezzo Crescente</option>
            </select>
        </div>
        <div class="grid" id="results-grid"></div>
    </div>

    <script>
        // INSERISCI I TUOI DATI SUPABASE QUI
        const SUPABASE_URL = 'https://gfzzysqyddcotclnzdzl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8hAW21CnmTN2vIlpLmBZBQ_vmS43QF5';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let deals = [];
        let links = [];

        async function loadData() {
            // Carica Link
            const resLinks = await supabase.from('lootsniper_links').select('*');
            if(resLinks.data) {
                links = resLinks.data;
                document.getElementById('links-count').innerText = links.length;
                renderLinks();
            }
            // Carica Bombe
            const resDeals = await supabase.from('lootsniper_deals').select('*').order('created_at', { ascending: false });
            if(resDeals.data) {
                deals = resDeals.data;
                document.getElementById('bombs-count').innerText = deals.length;
                renderDeals();
            }
        }

        async function addLink() {
            const nome = document.getElementById('l-nome').value;
            const piattaforma = document.getElementById('l-plat').value;
            const url = document.getElementById('l-url').value;
            
            if(!nome || !url) return alert("❌ Devi compilare Nome e URL!");

            const btn = document.querySelector('.btn-add');
            btn.innerText = "⏳ Salvataggio...";

            // Prova a inserire i dati
            const { error } = await supabase.from('lootsniper_links').insert([{ nome, piattaforma, url }]);
            
            if (error) {
                alert("❌ ERRORE DATABASE:\n" + error.message);
                btn.innerText = "➕ Salva sul Server";
            } else {
                document.getElementById('l-nome').value = ''; 
                document.getElementById('l-url').value = '';
                btn.innerText = "➕ Salva sul Server";
                loadData();
            }
        }

        async function deleteLink(id) {
            if(confirm("Eliminare questa ricerca?")) {
                await supabase.from('lootsniper_links').delete().eq('id', id);
                loadData();
            }
        }
        
        async function deleteDeal(id) {
            if(confirm("Eliminare questa offerta?")) {
                await supabase.from('lootsniper_deals').delete().eq('id', id);
                loadData();
            }
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = "";
            links.forEach(l => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="link-item">
                        <span><b>${l.piattaforma}:</b> ${l.nome}</span>
                        <button class="del-btn" onclick="deleteLink('${l.id}')">X</button>
                    </div>
                `);
            });
        }

        function renderDeals() {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = ""; 
            const sortVal = document.getElementById('sort-order').value;
            let sorted = [...deals]; 
            
            if (sortVal === 'margin') sorted.sort((a, b) => b.margine - a.margine);
            else if (sortVal === 'price-asc') sorted.sort((a, b) => a.prezzo - b.prezzo);
            else if (sortVal === 'date') sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            sorted.forEach(item => {
                grid.insertAdjacentHTML('beforeend', `
                    <div class="card">
                        <div class="card-header">
                            <span class="platform-badge ${item.piattaforma.toLowerCase()}">${item.piattaforma}</span>
                            <div class="card-title">${item.titolo.substring(0, 50)}...</div>
                        </div>
                        <div class="card-body">
                            <div class="prices">
                                <div><span style="font-size: 11px;">RICHIESTA</span><br><span class="req-price">${item.prezzo}€</span></div>
                                <div class="est-price"><span>VALORE</span><strong>${item.stima}€</strong><br><span style="color:var(--success); font-weight:bold;">Risparmi ${item.margine}€</span></div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a href="${item.url}" target="_blank" class="btn-link">Apri Annuncio ➔</a>
                            <button class="btn-link" style="flex: 0.3; background: var(--danger);" onclick="deleteDeal('${item.id}')">🗑️</button>
                        </div>
                    </div>
                `);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
